holdout = ["2024-01-01", "2026-01-01"]

[weather]
# Chicago O'Hare, Pittsburgh International, Philadelphia International, Baltimore/Washington.
stations = ["72530094846", "72520094823", "72408013739", "72406093721"]
url = "https://noaa-global-hourly-pds.s3.amazonaws.com/{year}/{station}.csv"

[sources]
eia860_index = "https://www.eia.gov/electricity/data/eia860/"
nrc_scrams = "https://www.nrc.gov/cdn/legacy/reactors/operating/dataset/scram-event-notifications.xlsx"
da = "da_hrl_lmps"
rt = "rt_hrl_lmps"
load = "hrl_load_metered"
